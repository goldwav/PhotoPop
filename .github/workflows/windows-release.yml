name: windows-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package Windows alpha
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the complete release gate
        run: pnpm verify:release
      - name: Build the exact unsigned Windows artifacts
        run: pnpm build:desktop --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify artifacts, smoke-test the packaged app, and record provenance
        run: node scripts/verify-windows-release.mjs
        env:
          PHOTOPOP_RELEASE_DIR: release
      - name: Upload release-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPop-Windows-Release-Evidence-${{ github.run_id }}
          path: |
            artifacts/performance-reference.json
            artifacts/playwright-report
            artifacts/playwright-results
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPop-Windows-${{ github.ref_name }}
          path: |
            release/PhotoPop-Setup-*.exe
            release/PhotoPop-Portable-*.exe
            release/PhotoPop-*.zip
            release/SHA256SUMS.txt
            release/PROVENANCE.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish unsigned alpha prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PhotoPop-Windows-${{ github.ref_name }}
          path: release
      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $version = $manifest.version
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag '$env:RELEASE_TAG' does not match package version '$expectedTag'."
          }

          $files = @(
            "release/PhotoPop-Setup-$version-x64.exe"
            "release/PhotoPop-Portable-$version-x64.exe"
            "release/PhotoPop-$version-x64.zip"
            "release/SHA256SUMS.txt"
            "release/PROVENANCE.json"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Verified release file is missing: $file"
            }
          }

          $notes = @"
          ## Unsigned Windows alpha

          > **Windows reputation warning:** These alpha artifacts are intentionally unsigned. Windows SmartScreen or Microsoft Defender may show an “unrecognized app” warning. Download only from this GitHub release and verify the file against `SHA256SUMS.txt` before running it.

          This prerelease contains the Windows x64 installer, portable executable, and portable ZIP. Build provenance is recorded in `PROVENANCE.json`.
          "@

          gh release create $env:RELEASE_TAG @files `
            --verify-tag `
            --prerelease `
            --title "PhotoPop $env:RELEASE_TAG — unsigned Windows alpha" `
            --notes $notes
