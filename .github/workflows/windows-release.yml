name: windows-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package Windows alpha
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release tags to belong to the default branch
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = "Stop"
          $defaultBranchRef = "refs/remotes/origin/$env:DEFAULT_BRANCH"
          git show-ref --verify --quiet $defaultBranchRef
          if ($LASTEXITCODE -ne 0) {
            throw "Default branch history is unavailable at '$defaultBranchRef'."
          }

          $releaseCommit = (git rev-parse "$env:GITHUB_SHA^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $releaseCommit) {
            throw "Release tag target '$env:GITHUB_SHA' is not a commit."
          }

          git merge-base --is-ancestor $releaseCommit $defaultBranchRef
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag target '$releaseCommit' is not on '$env:DEFAULT_BRANCH'."
          }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the automated release gate
        run: pnpm verify:release
      - name: Build the exact unsigned Windows artifacts
        run: pnpm build:desktop --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify artifacts, smoke-test the packaged app, and record provenance
        run: node scripts/verify-windows-release.mjs
        env:
          PHOTOPOP_RELEASE_DIR: release
      - name: Attest verified Windows release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            release/PhotoPop-Setup-*.exe
            release/PhotoPop-Portable-*.exe
            release/PhotoPop-*.zip
            release/SHA256SUMS.txt
            release/PROVENANCE.json
      - name: Upload release-gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PhotoPop-Windows-Release-Evidence-${{ github.run_id }}
          path: |
            artifacts/performance-reference.json
            artifacts/playwright-report
            artifacts/playwright-results
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PhotoPop-Windows-${{ github.run_id }}
          path: |
            release/PhotoPop-Setup-*.exe
            release/PhotoPop-Portable-*.exe
            release/PhotoPop-*.zip
            release/SHA256SUMS.txt
            release/PROVENANCE.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish unsigned alpha prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    environment: windows-alpha-release
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: PhotoPop-Windows-${{ github.run_id }}
          path: release
      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $version = $manifest.version
          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag '$env:RELEASE_TAG' does not match package version '$expectedTag'."
          }

          $files = @(
            "release/PhotoPop-Setup-$version-x64.exe"
            "release/PhotoPop-Portable-$version-x64.exe"
            "release/PhotoPop-$version-x64.zip"
            "release/SHA256SUMS.txt"
            "release/PROVENANCE.json"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Verified release file is missing: $file"
            }
          }

          $notes = @'
          ## Unsigned Windows alpha

          > **Windows reputation warning:** These alpha artifacts are intentionally unsigned. Windows SmartScreen or Microsoft Defender may show an “unrecognized app” warning. Download only from this GitHub release and verify the file against `SHA256SUMS.txt` before running it.

          This prerelease contains the Windows x64 installer, portable executable, and portable ZIP. Build provenance is recorded in `PROVENANCE.json`.

          Verify any downloaded release file with GitHub CLI:

          ~~~text
          gh attestation verify <downloaded-file> --repo ${{ github.repository }}
          ~~~
          '@

          gh release create $env:RELEASE_TAG @files `
            --verify-tag `
            --prerelease `
            --title "PhotoPop $env:RELEASE_TAG — unsigned Windows alpha" `
            --notes $notes
