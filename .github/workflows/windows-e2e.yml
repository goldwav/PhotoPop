name: windows-e2e

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Record 4096x4096 30-layer CPU reference evidence
        run: node scripts/performance-reference.mjs --assert --output artifacts/performance-reference.json
      - name: Run Electron workflow smoke gates
        run: pnpm exec playwright test --config playwright.electron.config.mts
        env:
          ELECTRON_ENABLE_LOGGING: "1"
      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PhotoPop-Windows-E2E-${{ github.run_id }}
          path: |
            artifacts/performance-reference.json
            artifacts/playwright-report
            artifacts/playwright-results
            tests/e2e/release-gates.json
          if-no-files-found: warn
          retention-days: 14
